<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEMOSPHERE — Sign In / Register</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;">
    <div class="card" style="max-width:480px;width:100%;">
      <div style="display:flex;align-items:center;gap:0.85rem;margin-bottom:1.25rem;">
        <div class="brand-logo">M</div>
        <div>
          <div class="brand-title" style="color:var(--text-primary);">MEMOSPHERE</div>
          <span style="font-size:0.82rem;color:var(--text-secondary);">Never Lose a Memory. Never Feel Alone.</span>
        </div>
      </div>

      <div style="display:flex;gap:0.5rem;margin-bottom:1.25rem;">
        <button id="tab-login" class="btn btn-primary" style="flex:1;" onclick="switchAuthTab('login')">Sign In</button>
        <button id="tab-register" class="btn btn-secondary" style="flex:1;" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <div id="auth-alert" style="display:none;padding:0.75rem;border-radius:10px;margin-bottom:1rem;font-weight:600;font-size:0.9rem;"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" value="aarav@memosphere.local" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" value="memosphere123" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-bottom:0.75rem;">Sign In to MEMOSPHERE</button>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" style="flex:1;font-size:0.8rem;" onclick="fillDemo('aarav@memosphere.local', 'memosphere123')">
            Demo Primary User
          </button>
          <button type="button" class="btn btn-secondary" style="flex:1;font-size:0.8rem;" onclick="fillDemo('priya@memosphere.local', 'caregiver123')">
            Demo Caregiver
          </button>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Aarav Sharma" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-control" required />
        </div>
        <div class="form-group">
          <label class="form-label">Account Role</label>
          <select id="reg-role" class="form-control">
            <option value="user">Primary Companion User</option>
            <option value="caregiver">Caregiver (Consent-Gated Wellness View)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
      </form>

      <div style="margin-top:1.25rem;text-align:center;">
        <a href="/index.html" style="color:var(--brand-blue);font-weight:600;text-decoration:none;">← Return to Companion Dashboard</a>
      </div>
    </div>
  </div>

  <script src="/js/accessibility.js"></script>
  <script>
    function switchAuthTab(tab) {
      document.getElementById("login-form").style.display = tab === "login" ? "block" : "none";
      document.getElementById("register-form").style.display = tab === "register" ? "block" : "none";
      document.getElementById("tab-login").className = tab === "login" ? "btn btn-primary" : "btn btn-secondary";
      document.getElementById("tab-register").className = tab === "register" ? "btn btn-primary" : "btn btn-secondary";
    }

    function fillDemo(email, pass) {
      document.getElementById("login-email").value = email;
      document.getElementById("login-password").value = pass;
    }

    function showAuthAlert(msg, isError) {
      const box = document.getElementById("auth-alert");
      box.style.display = "block";
      box.style.background = isError ? "#fee2e2" : "#dcfce7";
      box.style.color = isError ? "#b91c1c" : "#166534";
      box.textContent = msg;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        showAuthAlert(data.error || "Sign in failed.", true);
        return;
      }
      showAuthAlert("Signed in! Redirecting...", false);
      setTimeout(() => {
        window.location.href = data.user.role === "caregiver" ? "/caregiver.html" : "/index.html";
      }, 500);
    }

    async function handleRegister(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById("reg-name").value,
        email: document.getElementById("reg-email").value,
        password: document.getElementById("reg-password").value,
        role: document.getElementById("reg-role").value,
      };
      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        showAuthAlert(data.error || "Registration failed.", true);
        return;
      }
      showAuthAlert("Account created! Redirecting...", false);
      setTimeout(() => {
        window.location.href = data.user.role === "caregiver" ? "/caregiver.html" : "/index.html";
      }, 500);
    }
  </script>
</body>
</html>
