[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-memory-companion"
version = "0.1.0"
description = "Personal Memory Companion desktop app with an evidence-based Personal Memory AI Agent"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6==6.12.0",
    "pydantic==2.14.1",
    "google-genai==2.33.0",
    "openai==3.55.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "argon2-cffi==25.1.0",
    "sqlcipher3==0.6.5",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]
# Voice support is optional: it substantially increases install complexity and
# needs working audio hardware. See requirements-voice.txt.
voice = [
    "sounddevice>=0.4.6",
    "pyttsx3>=2.90",
]

[project.scripts]
memory-companion = "memory_companion.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires a real API key / network and is skipped by default",
    "ui: requires a Qt application instance (offscreen is supported)",
]

[tool.coverage.run]
source = ["src"]
